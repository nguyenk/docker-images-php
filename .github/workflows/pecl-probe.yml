name: pecl probe
on: [workflow_dispatch, push]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          # exact request sent by PEAR 1.10.13 (PEAR/REST.php downloadHttp)
          for p in /channel.xml /rest/r/event/allreleases.xml /rest/p/event/info.xml; do
            for i in 1 2 3; do
              echo "=== http $p #$i"
              printf 'GET %s HTTP/1.1\r\nHost: pecl.php.net\r\nUser-Agent: PEAR/1.10.13/PHP/7.4.33\r\nAccept-Encoding:\r\nConnection: close\r\n\r\n' "$p" \
                | nc -w 10 pecl.php.net 80 > resp
              sed -n '1,/^\r$/p' resp | tr -d '\r' | grep -i -E '^HTTP|^server|^content-(length|encoding|type)|^transfer-encoding|^cdn-cache'
              sed '1,/^\r$/d' resp | head -c 120 | od -c | head -3
            done
          done
