name: pecl probe
on: [workflow_dispatch, push]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          curl -s https://ifconfig.me; echo
          for u in https://pecl.php.net/channel.xml https://pecl.php.net/rest/r/event/allreleases.xml https://pecl.php.net/get/event-3.1.6.tgz; do
            for ua in 'PEAR/1.10.13/PHP/7.4.33' 'curl/8.5.0'; do
              echo "=== $u  UA=$ua"
              curl -s -A "$ua" -D - -o body -w 'size=%{size_download}\n' "$u" | grep -i -E '^HTTP|^content-type|^server|^cf-|size='
              head -c 300 body | tr -c '[:print:]\n' '.'; echo
            done
          done
