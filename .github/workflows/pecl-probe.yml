name: pecl probe
on: [workflow_dispatch, push]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          for u in http://pecl.php.net/channel.xml http://pecl.php.net/rest/r/event/allreleases.xml; do
            echo "=== $u"
            curl -s --http1.0 -A 'PEAR/1.10.13/PHP/7.4.33' -D - -o body "$u" | tr -d '\r'
            head -c 400 body | tr -c '[:print:]\n' '.'; echo
          done
      - run: docker run --rm -v $PWD/.github:/p:ro ubuntu:24.04 bash /p/pecl.sh 2>&1 | tail -30
